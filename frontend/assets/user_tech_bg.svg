<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Crisp High-Res Shadows -->
    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.18"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="cyanTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="blueTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f4c81"/>
    </linearGradient>

    <!-- Tech Dot Matrix Pattern -->
    <pattern id="hiResGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0284c7" fill-opacity="0.12"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.05"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#hiResGrid)"/>

  <!-- Concentric Tech Dials (Left & Center Left) -->
  <g transform="translate(520, 520)" fill="none" stroke-linecap="round">
    <!-- Outer Outer Circular Scale -->
    <circle cx="0" cy="0" r="460" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="0" cy="0" r="420" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.3"/>
    <circle cx="0" cy="0" r="380" stroke="#06b6d4" stroke-width="2" stroke-dasharray="40 10 20 10" opacity="0.45"/>
    <circle cx="0" cy="0" r="340" stroke="#0284c7" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>

    <!-- Dial Tick Marks -->
    <g stroke="#0369a1" stroke-width="2" opacity="0.4">
      <line x1="0" y1="-380" x2="0" y2="-395"/>
      <line x1="190" y1="-329" x2="197" y2="-342"/>
      <line x1="329" y1="-190" x2="342" y2="-197"/>
      <line x1="380" y1="0" x2="395" y2="0"/>
      <line x1="329" y1="190" x2="342" y2="197"/>
      <line x1="190" y1="329" x2="197" y2="342"/>
      <line x1="0" y1="380" x2="0" y2="395"/>
      <line x1="-190" y1="329" x2="-197" y2="342"/>
      <line x1="-329" y1="190" x2="-342" y2="197"/>
      <line x1="-380" y1="0" x2="-395" y2="0"/>
      <line x1="-329" y1="-190" x2="-342" y2="-197"/>
      <line x1="-190" y1="-329" x2="-197" y2="-342"/>
    </g>

    <!-- Inner Blue Arc Dials -->
    <path d="M -300 0 A 300 300 0 0 1 300 0" stroke="url(#cyanTrace)" stroke-width="6" opacity="0.6"/>
    <path d="M 0 -260 A 260 260 0 0 1 260 0" stroke="#0f4c81" stroke-width="8" opacity="0.45"/>
  </g>

  <!-- Large Central White Mechanical Gear Wheel (Ultra Sharp Vector) -->
  <g transform="translate(520, 520)" filter="url(#gearShadow)">
    <!-- Main Outer Gear Circle & Teeth -->
    <path d="
      M 0 -210
      L 24 -210 L 32 -170 L 64 -164 L 96 -192 L 118 -180 L 112 -138 L 140 -124 L 176 -138 L 194 -120 L 174 -86 L 194 -66 L 230 -66 L 238 -44 L 202 -18 L 210 12 L 246 24 L 242 48 L 202 54 L 198 84 L 230 110 L 216 130 L 178 120 L 164 146 L 186 182 L 166 200 L 134 178 L 112 196 L 118 238 L 94 248 L 74 212 L 46 220 L 36 260 L 12 262 L -6 222 L -34 220 L -52 258 L -76 250 L -76 210 L -104 198 L -134 224 L -152 208 L -138 170 L -160 152 L -198 164 L -212 144 L -186 114 L -200 88 L -240 84 L -244 60 L -208 44 L -210 14 L -248 -4 L -244 -28 L -206 -38 L -200 -68 L -234 -94 L -220 -114 L -182 -104 L -166 -128 L -188 -164 L -170 -182 L -136 -162 L -114 -180 L -118 -222 L -94 -230 L -76 -194 L -48 -200 L -36 -240 L -12 -242 Z
    " fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Inner Central Cutout Circle -->
    <circle cx="0" cy="0" r="95" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
  </g>

  <!-- Rightward Circuit Bus Traces (Crisp Vector Lines) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Bus Line Pair -->
    <path d="M 680 220 H 1150 L 1280 350 H 1820" stroke="url(#cyanTrace)" stroke-width="4.5"/>
    <path d="M 720 255 H 1130 L 1250 375 H 1870" stroke="url(#blueTrace)" stroke-width="3.5"/>
    <path d="M 760 290 H 1110 L 1220 400 H 1920" stroke="#0284c7" stroke-width="2.5" stroke-opacity="0.6"/>

    <!-- Middle Bus Line Block (Matches user's image right-hand side) -->
    <path d="M 850 480 H 1320 L 1440 600 H 1920" stroke="#06b6d4" stroke-width="5" filter="url(#cyanGlow)"/>
    <path d="M 880 515 H 1300 L 1410 625 H 1880" stroke="#0284c7" stroke-width="3.5"/>
    <path d="M 910 550 H 1280 L 1380 650 H 1840" stroke="#0f4c81" stroke-width="3"/>

    <!-- Lower Bus Lines -->
    <path d="M 450 820 H 980 L 1120 960 H 1850" stroke="url(#blueTrace)" stroke-width="4"/>
    <path d="M 490 855 H 960 L 1090 985 H 1800" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.7"/>

    <!-- Vertical Connector Links -->
    <path d="M 1280 350 V 600" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 8"/>
    <path d="M 1440 600 V 820" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M 1150 220 L 1200 150 H 1600" stroke="#0369a1" stroke-width="3"/>
  </g>

  <!-- Right Side Terminal Shapes & Circuit Chips -->
  <g fill="#0284c7" stroke="#0369a1" stroke-width="2">
    <!-- Blue Polygon Chip 1 (Top Right) -->
    <path d="M 1450 250 L 1750 250 L 1700 300 L 1400 300 Z" fill="url(#blueTrace)" filter="url(#softShadow)"/>
    
    <!-- Blue Polygon Chip 2 (Middle Right) -->
    <path d="M 1420 580 L 1680 580 L 1640 630 L 1380 630 Z" fill="#0284c7" filter="url(#softShadow)"/>

    <!-- Cyan Accent Strip -->
    <path d="M 1250 375 L 1450 375 L 1420 405 L 1220 405 Z" fill="#06b6d4"/>
  </g>

  <!-- Node Connection Pins -->
  <g fill="#06b6d4" stroke="#ffffff" stroke-width="2">
    <circle cx="1150" cy="220" r="7" filter="url(#cyanGlow)"/>
    <circle cx="1280" cy="350" r="8" fill="#0284c7"/>
    <circle cx="1320" cy="480" r="8" fill="#06b6d4"/>
    <circle cx="1440" cy="600" r="8" fill="#0284c7"/>
    <circle cx="1120" cy="960" r="7"/>

    <circle cx="1600" cy="150" r="6" fill="#0369a1"/>
    <circle cx="1750" cy="250" r="6" fill="#0284c7"/>
    <circle cx="1680" cy="580" r="6" fill="#06b6d4"/>
  </g>

  <!-- Top Right Amber/Gold Accent Gear Wheel -->
  <g transform="translate(1720, 210)" filter="url(#softShadow)">
    <path d="
      M 0 -35 L 5 -35 L 7 -26 L 15 -23 L 22 -29 L 26 -26 L 23 -18 L 29 -11 L 37 -13 L 39 -7 L 31 -2 L 31 6 L 39 10 L 37 16 L 29 14 L 23 21 L 26 29 L 22 32 L 15 26 L 7 29 L 5 38 L -1 38 L -3 29 L -11 26 L -18 32 L -22 29 L -19 21 L -25 14 L -33 16 L -35 10 L -27 6 L -27 -2 L -35 -7 L -33 -13 L -25 -11 L -19 -18 L -22 -26 L -18 -29 L -11 -23 L -3 -26 Z
    " fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Bottom Right Dark Industrial Gear Wheel -->
  <g transform="translate(1540, 605)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="40" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#f8fafc"/>
    <g stroke="#ffffff" stroke-width="3">
      <line x1="0" y1="-30" x2="0" y2="-40"/>
      <line x1="30" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="30" x2="0" y2="40"/>
      <line x1="-30" y1="0" x2="-40" y2="0"/>
      <line x1="21" y1="-21" x2="28" y2="-28"/>
      <line x1="21" y1="21" x2="28" y2="28"/>
      <line x1="-21" y1="21" x2="-28" y2="28"/>
      <line x1="-21" y1="-21" x2="-28" y2="-28"/>
    </g>
  </g>

  <!-- Left Arrow Navigation Pointer -->
  <g transform="translate(1480, 800)" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round">
    <path d="M 30 0 H -10 L 5 -15 M -10 0 L 5 15"/>
  </g>
</svg>
